infisical:
  workspace_id: "your-workspace-id"
  environment: "prod"

callers:
  - key: "sk_agent_replace_me"
    targets: ["github", "stripe"]

targets:
  # oauth mode: the Infisical secret holds a JSON blob
  # {"client_id": "...", "client_secret": "...", "token_url": "...", "scope": "..."}.
  # The broker exchanges it for a short-lived access token (client_credentials
  # grant), caches it, and injects it as "Authorization: Bearer <token>".
  - name: github
    mode: oauth
    base_url: "https://api.github.com"
    infisical_secret: "/prod/github/oauth_client"

  - name: stripe
    mode: proxy
    base_url: "https://api.stripe.com"
    infisical_secret: "/prod/stripe/api_key"
    inject_header: "Authorization"
    inject_prefix: "Bearer "
